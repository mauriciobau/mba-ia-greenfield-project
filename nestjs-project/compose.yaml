services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-videos}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-streamtube}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-streamtube-local-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: 1g

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["tail", "-f", "/dev/null"]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-videos}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-streamtube}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-streamtube-local-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node --version && ffmpeg -version >/dev/null && ffprobe -version >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 2g

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:8.6.8-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  minio:
    image: streamtube-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./infra/minio
      dockerfile: Dockerfile
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-streamtube}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-streamtube-local-password}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOWED_ORIGINS:-http://localhost:3001}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 2g

  minio-init:
    image: streamtube-minio:RELEASE.2025-10-15T17-29-55Z
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-streamtube}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-streamtube-local-password}
      S3_BUCKET: ${S3_BUCKET:-videos}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m

volumes:
  redis_data:
  minio_data:


